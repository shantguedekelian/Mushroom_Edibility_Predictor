<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mushroom Challenge</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>

<div class="container">

    <!-- Header -->
    <header>
        <h1>Mushroom Challenge 🍄</h1>
        <p>Can you beat the ML model? Guess if the mushroom is edible or poisonous.</p>
    </header>

    <!-- Scoreboard -->
    <div class="scoreboard">
        <div class="score-card">
            <h3>You</h3>
            <p id="userScore">0</p>
        </div>

        <div class="score-card">
            <h3>Model</h3>
            <p id="modelScore">0</p>
        </div>
    </div>

    <!-- Game Card -->
    <div class="game-card">

        <!-- Image -->
        <img id="mushroomImage" src="placeholder.jpg" alt="Mushroom Image">

        <!-- Guess Buttons -->
        <div class="buttons">
            <button class="edible">Edible</button>
            <button class="poisonous">Poisonous</button>
        </div>

        <!-- Result -->
        <div class="result" id="resultArea">
            <p>Result will appear here</p>
        </div>

        <!-- Next -->
        <button class="next">Next Mushroom →</button>

    </div>

</div>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
